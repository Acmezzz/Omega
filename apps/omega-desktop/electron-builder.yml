appId: com.omega.desktop
productName: Omega Desktop
artifactName: omega-desktop-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - electron/**/*
  - index.html
  - styles.css
  - renderer.js
  - package.json
extraResources:
  - from: ../../.pi/extensions
    to: omega-runtime/.pi/extensions
  - from: ../../packages/coding-agent/dist
    to: omega-runtime/packages/coding-agent/dist
asar: true
npmRebuild: false
publish: null
linux:
  target:
    - AppImage
win:
  target:
    - nsis
mac:
  target:
    - dmg

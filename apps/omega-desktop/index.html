<!doctype html>
<html lang="zh">
<head>
	<meta charset="utf-8" />
	<title>Omega Desktop</title>
	<style>
		body { font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #1e1e1e; color: #d4d4d4; }
		#log { flex: 1; overflow-y: auto; padding: 12px; }
		.msg { margin-bottom: 8px; white-space: pre-wrap; }
		.msg.user { color: #6c9eff; }
		.msg.part { color: #999; font-family: monospace; }
		.msg.tool { color: #b98bff; font-family: monospace; font-size: 12px; }
		#bar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #333; }
		#input { flex: 1; background: #2a2a2a; color: #eee; border: none; padding: 10px; border-radius: 6px; }
		button { background: #3a3a3a; color: #eee; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
	</style>
</head>
<body>
	<div id="log"></div>
	<div id="bar">
		<input id="input" placeholder="输入消息…" />
		<button id="send">发送</button>
	</div>
	<script src="./renderer.js"></script>
</body>
</html>
